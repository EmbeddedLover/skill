interface:
  display_name: "Embedded Project Intake"
  short_description: "Generate embedded project handoff reports for engineers and future AI sessions."
  default_prompt: "Use $embedded-project-intake to inspect this embedded project. First list numbered candidate business/technical paths for the user to choose, allowing numeric replies like 1,3,5, auto for AI-selected priority paths, or full/all/全量分析 for full analysis. Then analyze core modules with subagents when available, merge the results, and generate local Markdown plus standalone HTML handoff reports covering architecture, module responsibilities, function-level call chains, state ownership, concurrency/event model, implementation entry points, validation strategy, risks, evidence, and AI handoff summary."
